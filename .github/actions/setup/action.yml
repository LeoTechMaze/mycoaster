name: Setup workspace
description: Install pnpm and Node, then install dependencies for one package and its workspace deps.

inputs:
  package:
    description: Workspace package name, e.g. @mycoaster/api. Its workspace dependencies are installed too.
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        # Same major as local development; lockfile and minimumReleaseAge apply as on dev machines
        version: 12.10.1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      # The workspace root is included for the shared ESLint config and its plugins
      run: pnpm install --frozen-lockfile --filter "${{ inputs.package }}..." --filter mycoaster
